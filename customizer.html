<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Onggoh Cheesecake — Bikin Versimu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-[#FAF7F2] text-[#2C221E] font-sans antialiased">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 bg-[#FAF7F2]/90 backdrop-blur-md border-b border-[#EFE5D8]">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="font-serif text-2xl font-bold tracking-tight text-[#2C221E]">L'Onggoh<span class="text-[#D97736]">.</span></a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-[#6B5B52]">
        <a href="index.html" class="hover:text-[#D97736] transition">Beranda</a>
        <a href="menu.html" class="hover:text-[#D97736] transition">Menu Pilihan</a>
        <a href="customizer.html" class="text-[#D97736] transition">Bikin Versimu</a>
        <a href="reviews.html" class="hover:text-[#D97736] transition">Ulasan</a>
      </nav>
      <button onclick="toggleCart()" class="relative bg-white border border-[#EFE5D8] hover:border-[#D97736] p-3 rounded-full shadow-sm transition flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#2C221E]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-[#D97736] text-white font-extrabold text-[10px] w-5 h-5 rounded-full flex items-center justify-center scale-0 transition-transform duration-300">0</span>
      </button>
    </div>
  </header>

  <!-- CUSTOMIZER SECTION -->
  <section class="max-w-7xl mx-auto px-6 py-16">
    <div id="customizerCard" class="bg-white rounded-3xl p-8 md:p-12 border border-[#EFE5D8] shadow-xl grid grid-cols-1 md:grid-cols-12 gap-10 items-center">
      <div class="md:col-span-5 text-center space-y-4">
        <div class="relative inline-block overflow-hidden rounded-2xl border-4 border-[#F3E5D8] shadow-md">
          <img id="customPreviewImg" src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80" class="w-full h-72 object-cover transition-all duration-300">
          <span id="customSizeBadge" class="absolute top-3 right-3 bg-[#2C221E] text-white text-xs font-bold px-3 py-1 rounded-full">Whole Cake (20cm)</span>
        </div>
        <div class="text-left bg-[#FAF7F2] p-4 rounded-xl border border-[#EFE5D8]">
          <h4 class="font-serif font-bold text-[#2C221E] text-lg" id="customTitle">Custom Classic Cheesecake</h4>
          <p id="customDesc" class="text-xs text-[#6B5B52] mt-1">Ukuran Whole Cake</p>
        </div>
      </div>

      <div class="md:col-span-7 space-y-6">
        <div>
          <span class="text-[#D97736] font-bold text-xs uppercase tracking-wider">Interaktif Builder</span>
          <h2 class="font-serif text-3xl font-bold text-[#2C221E] mt-1">Buat Kombinasi Cheesecake Impianmu</h2>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#6B5B52] uppercase tracking-wider mb-2">1. Pilih Ukuran Kue</label>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="setCustomSize('slice', 45000, 'Single Slice')" class="size-btn border-2 border-[#D97736] bg-[#F3E5D8]/30 font-bold text-sm py-3 rounded-xl transition text-[#2C221E] text-center">Single Slice <br><span class="text-xs font-normal text-[#6B5B52]">Rp 45.000</span></button>
            <button onclick="setCustomSize('whole', 280000, 'Whole Cake (20cm)')" class="size-btn border-2 border-transparent bg-[#FAF7F2] font-bold text-sm py-3 rounded-xl transition text-[#2C221E] text-center">Whole Cake (20cm) <br><span class="text-xs font-normal text-[#6B5B52]">Rp 280.000</span></button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#6B5B52] uppercase tracking-wider mb-2">2. Pilih Varian Rasa</label>
          <div class="flex flex-wrap gap-2">
            <button data-flavor="Classic New York"
  onclick="setFlavor('Classic New York', 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80')"
  class="flavor-btn px-4 py-2 text-xs font-bold rounded-lg">
  Classic New York
</button>

<button data-flavor="Ruby Strawberry"
  onclick="setFlavor('Ruby Strawberry', 'https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=600&q=80')"
  class="flavor-btn px-4 py-2 text-xs font-bold rounded-lg">
  Ruby Strawberry
</button>

<button data-flavor="Belgian Chocolate"
  onclick="setFlavor('Belgian Chocolate', 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80')"
  class="flavor-btn px-4 py-2 text-xs font-bold rounded-lg">
  Belgian Chocolate
</button>
</div>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#6B5B52] uppercase tracking-wider mb-2">3. Tambahan Topping (+Rp 10.000)</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-[#2C221E]"><input type="checkbox" id="topBerry" onchange="calculateCustomPrice()" class="rounded text-[#D97736] focus:ring-[#D97736] w-4 h-4"> Extra Strawberry</label>
            <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-[#2C221E]"><input type="checkbox" id="topChoco" onchange="calculateCustomPrice()" class="rounded text-[#D97736] focus:ring-[#D97736] w-4 h-4"> Choco Drizzle</label>
          </div>
        </div>

        <div class="flex items-center justify-between pt-4 border-t border-[#EFE5D8]">
          <div>
            <div class="text-xs text-[#6B5B52]">Total Harga Kustom:</div>
            <div id="customTotalPrice" class="font-serif text-3xl font-extrabold text-[#D97736]">Rp 45.000</div>
          </div>
          <button onclick="addCustomToCart()" class="bg-[#2C221E] hover:bg-black text-white font-bold text-sm px-6 py-3.5 rounded-full transition shadow-md">＋ Tambahkan Kustomisasi</button>
        </div>
      </div>
    </div>
  </section>

  <!-- CART DRAWER -->
  <div id="cartModal" class="fixed inset-0 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
    <div onclick="toggleCart()" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div id="cartDrawer" class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl p-6 flex flex-col transform translate-x-full transition-transform duration-300 pointer-events-auto">
      <div class="flex items-center justify-between pb-4 border-b border-[#EFE5D8]">
        <h3 class="font-serif font-bold text-xl text-[#2C221E]">Keranjang Belanja</h3>
        <button onclick="toggleCart()" class="text-[#6B5B52] hover:text-[#2C221E] text-xl font-bold">&times;</button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto py-4 space-y-4"></div>
      <div class="border-t border-[#EFE5D8] pt-4 space-y-3">
        <div class="flex justify-between text-sm font-bold text-[#2C221E]"><span>Subtotal</span><span id="cartSubtotal" class="text-[#D97736]">Rp 0</span></div>
        <button onclick="checkoutWhatsApp()" class="w-full bg-[#D97736] hover:bg-[#B85E23] text-white font-bold py-3.5 rounded-full transition shadow-lg">Pesan via WhatsApp 🚀</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
